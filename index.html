<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>みんなのチャット</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --accent:#4f6ef7; --text:#1c1e21; --sub:#6b7280; --mine:#dbe4ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1e2127; --accent:#6f87ff; --text:#e8eaed; --sub:#9aa0a6; --mine:#2c3a6b; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; background: var(--bg); color: var(--text); }
  #login { display:flex; align-items:center; justify-content:center; height:100%; padding:16px; }
  .box { background:var(--card); padding:28px; border-radius:16px; width:100%; max-width:360px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
  .box h1 { margin:0 0 20px; font-size:20px; }
  label { display:block; font-size:13px; color:var(--sub); margin:12px 0 4px; }
  input[type=text], input[type=password] { width:100%; padding:11px 12px; border:1px solid #cfd4dc; border-radius:10px; font-size:16px; background:transparent; color:var(--text); }
  button { cursor:pointer; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; padding:11px 18px; }
  .box button { width:100%; margin-top:20px; }
  #err { color:#d93025; font-size:13px; min-height:18px; margin-top:10px; }
  #app { display:none; flex-direction:column; height:100%; max-width:720px; margin:0 auto; }
  header { padding:12px 16px; background:var(--card); border-bottom:1px solid rgba(128,128,128,.2); display:flex; justify-content:space-between; align-items:center; }
  header b { font-size:16px; }
  header span { font-size:13px; color:var(--sub); }
  #log { flex:1; overflow-y:auto; padding:12px 12px 4px; }
  .msg { max-width:82%; margin:8px 0; }
  .msg .meta { font-size:12px; color:var(--sub); margin:0 4px 2px; }
  .bubble { background:var(--card); padding:8px 12px; border-radius:14px; white-space:pre-wrap; word-break:break-word; line-height:1.5; display:inline-block; }
  .bubble img { display:block; max-width:100%; max-height:320px; border-radius:10px; cursor:zoom-in; }
  .bubble img + span { display:block; margin-top:6px; }
  .mine { margin-left:auto; text-align:right; }
  .mine .bubble { background:var(--mine); text-align:left; }
  form { display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid rgba(128,128,128,.2); align-items:flex-end; }
  textarea { flex:1; resize:none; max-height:120px; padding:10px 12px; border:1px solid #cfd4dc; border-radius:12px; font:inherit; font-size:16px; background:transparent; color:var(--text); }
  #attach { background:transparent; color:var(--accent); border:1px solid var(--accent); padding:9px 12px; }
  #preview { display:none; padding:6px 12px; background:var(--card); font-size:13px; color:var(--sub); align-items:center; gap:8px; }
  #preview img { height:48px; border-radius:6px; }
  #preview button { background:transparent; color:#d93025; padding:2px 8px; font-size:13px; }
  #zoom { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); align-items:center; justify-content:center; z-index:9; }
  #zoom img { max-width:96%; max-height:96%; }
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <h1>💬 みんなのチャット</h1>
    <label>ニックネーム</label>
    <input type="text" id="name" maxlength="20" placeholder="例: たろう" autocomplete="nickname">
    <label>合言葉</label>
    <input type="password" id="pw" autocomplete="current-password">
    <div id="err"></div>
    <button id="enter">入る</button>
  </div>
</div>

<div id="app">
  <header><b>💬 みんなのチャット</b><span id="who"></span></header>
  <div id="log"></div>
  <div id="preview"><img id="pimg"><span id="pname"></span><button type="button" id="pclear">取消</button></div>
  <form id="form">
    <input type="file" id="file" accept="image/*" hidden>
    <button type="button" id="attach" title="画像を添付">🖼</button>
    <textarea id="text" rows="1" placeholder="メッセージを入力(Shift+Enterで改行)"></textarea>
    <button type="submit">送信</button>
  </form>
</div>
<div id="zoom"><img></div>

<script>
const $ = id => document.getElementById(id);
let myName = localStorage.getItem('chat_name') || '';
let pendingImage = null;
const seen = new Set();

$('name').value = myName;

async function login(pw) {
  const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'ログイン失敗');
}

$('enter').onclick = async () => {
  const name = $('name').value.trim();
  if (!name) { $('err').textContent = 'ニックネームを入力してください'; return; }
  try {
    await login($('pw').value);
    myName = name; localStorage.setItem('chat_name', myName);
    startChat();
  } catch (e) { $('err').textContent = e.message; }
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('enter').click(); });

// 既にログイン済み(Cookieあり)なら名前だけ確認して自動入室
(async () => {
  if (!myName) return;
  const r = await fetch('/api/me');
  if (r.ok) startChat();
})();

function startChat() {
  $('login').style.display = 'none';
  $('app').style.display = 'flex';
  $('who').textContent = myName + ' として参加中';
  connect();
}

function connect() {
  const es = new EventSource('/api/stream');
  es.onmessage = ev => addMessage(JSON.parse(ev.data));
  es.onerror = () => { if (es.readyState === 2) { es.close(); location.reload(); } };
}

function fmt(t) {
  const d = new Date(t);
  return d.toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function addMessage(m) {
  if (seen.has(m.id)) return;
  seen.add(m.id);
  const log = $('log');
  const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  const wrap = document.createElement('div');
  wrap.className = 'msg' + (m.name === myName ? ' mine' : '');
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = m.name + ' ・ ' + fmt(m.time);
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (m.image) {
    const img = document.createElement('img');
    img.src = m.image; img.loading = 'lazy';
    img.onload = () => { if (nearBottom) log.scrollTop = log.scrollHeight; };
    img.onclick = () => { $('zoom').firstElementChild.src = m.image; $('zoom').style.display = 'flex'; };
    bubble.appendChild(img);
  }
  if (m.text) {
    const s = document.createElement('span');
    s.textContent = m.text;   // textContentなのでHTMLは実行されない
    bubble.appendChild(s);
  }
  wrap.append(meta, bubble);
  log.appendChild(wrap);
  if (nearBottom || m.name === myName) log.scrollTop = log.scrollHeight;
}
$('zoom').onclick = () => { $('zoom').style.display = 'none'; };

// 画像を縮小してJPEG化(通信量を節約)
function shrink(file) {
  return new Promise((resolve, reject) => {
    if (file.type === 'image/gif' && file.size < 3 * 1024 * 1024) {
      const fr = new FileReader(); fr.onload = () => resolve(fr.result); fr.onerror = reject; fr.readAsDataURL(file); return;
    }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1280;
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => reject(new Error('画像を読み込めません'));
    img.src = url;
  });
}

async function setImage(file) {
  if (!file || !file.type.startsWith('image/')) return;
  try {
    pendingImage = await shrink(file);
    $('pimg').src = pendingImage; $('pname').textContent = file.name || '貼り付けた画像';
    $('preview').style.display = 'flex';
  } catch (e) { alert(e.message); }
}
function clearImage() { pendingImage = null; $('preview').style.display = 'none'; $('file').value = ''; }

$('attach').onclick = () => $('file').click();
$('file').onchange = e => setImage(e.target.files[0]);
$('pclear').onclick = clearImage;
$('text').addEventListener('paste', e => {
  for (const it of e.clipboardData.items) if (it.type.startsWith('image/')) { setImage(it.getAsFile()); e.preventDefault(); break; }
});

$('text').addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; });
$('text').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); }
});

let sending = false;
$('form').onsubmit = async e => {
  e.preventDefault();
  if (sending) return;
  const text = $('text').value;
  if (!text.trim() && !pendingImage) return;
  sending = true;
  try {
    const r = await fetch('/api/send', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name: myName, text, image: pendingImage }) });
    if (r.status === 401) { location.reload(); return; }
    if (!r.ok) { const j = await r.json().catch(() => ({})); alert(j.error || '送信に失敗しました'); }
    else { $('text').value = ''; $('text').style.height = 'auto'; clearImage(); }
  } catch (_) { alert('送信に失敗しました。通信を確認してください。'); }
  sending = false;
  $('text').focus();
};
</script>
</body>
</html>
